name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for npm provenance (OIDC trusted publishing)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to 11.x (staged publishing needs >= 11.15.0)
        # Pin to 11.x, NOT `latest`: npm 12 enforces install-script blocking
        # (allowScripts defaults off), which skips better-sqlite3's and
        # esbuild's build scripts and breaks the test/build steps.
        run: npm install -g npm@11

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Install hosted dependencies
        run: npm ci
        working-directory: hosted

      - name: Test
        run: npm test
        env:
          KEYBLIND_DEV: "true"
          KEYBLIND_PUBLIC_KEY: MCowBQYDK2VwAyEApW1Wgu2bKF4KN3pafAbYC2203SRyf9qdlITawyj9jJk=

      # `npm stage publish` runs `prepublishOnly`, which builds src/ and the
      # dashboard static export before packaging. `--provenance` attests the
      # tarball was built from this repo by this workflow.
      #
      # The trusted publisher is configured for *staged publishing*: it can only
      # `npm stage publish`, never publish directly to `latest`. A human with
      # 2FA then approves the staged tarball (npm web UI, or `npm stage approve
      # <stage-id>`), which promotes it to `latest`. This keeps `latest`
      # human-gated so a compromised repo cannot silently replace what
      # `npm i -g keyblind` installs.
      - name: Stage publish to npm (2FA-gated)
        run: npm stage publish --provenance --access public
